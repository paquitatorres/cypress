name: Cypress Tests
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 18 * * 4'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
        
          command: npx cypress run --browser chrome --reporter spec --reporter-options ""
        continue-on-error: true  

      - name: Generate Report
        if: always()
        run: npm run report

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-report
          path: cypress/reports

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos